{% extends 'base.html' %}
{% block title %}Password Reset Successful — Medicare{% endblock %}

{% block content %}
<div class="container py-5">
  <div class="row justify-content-center">
    <div class="col-md-6 col-lg-5">
      <div class="card border-0 shadow-sm rounded-4 p-4 p-md-5 bg-white text-center">
        
        <div class="d-inline-flex align-items-center justify-content-center bg-success bg-opacity-10 text-success rounded-circle mx-auto mb-3" style="width: 64px; height: 64px;">
          <svg width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><polyline points="20 6 9 17 4 12"></polyline></svg>
        </div>

        <h3 class="fw-bold mb-2">Password Reset Complete</h3>
        <p class="text-muted mb-4">
          Your password has been set. You may now log in with your new credentials.
        </p>

        <a href="{% url 'accounts:login' %}" class="btn btn-primary rounded-pill px-4 py-2 fw-semibold">
          Log In Now
        </a>

      </div>
    </div>
  </div>
</div>
{% endblock %}
