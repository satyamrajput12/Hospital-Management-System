{% extends 'base.html' %}
{% block title %}403 — Access Denied | Medicare{% endblock %}

{% block content %}
<div class="container py-5 text-center my-auto">
  <div class="row justify-content-center">
    <div class="col-md-7 col-lg-6">
      <div class="card border-0 shadow-sm rounded-4 p-5 bg-white">
        <div style="font-size: 4.5rem; line-height: 1;">🛡️</div>
        <h1 class="display-5 fw-bold text-danger mt-3">403</h1>
        <h3 class="fw-semibold text-dark mb-3">Access Restricted</h3>
        <p class="text-muted mb-4">
          You do not have permission to access this private medical record, prescription, or administrative resource.
        </p>
        <div class="d-flex justify-content-center gap-3 flex-wrap">
          <a href="{% url 'core:redirect_dashboard' %}" class="btn btn-primary rounded-pill px-4 py-2 fw-semibold">
            Go to Your Dashboard
          </a>
          <a href="{% url 'core:home' %}" class="btn btn-outline-secondary rounded-pill px-4 py-2 fw-semibold">
            Return Home
          </a>
        </div>
      </div>
    </div>
  </div>
</div>
{% endblock %}
